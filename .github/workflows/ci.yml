name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} / ${{ matrix.os }} regression
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: '20', os: ubuntu-latest }
          - { node: '22', os: ubuntu-latest }
          - { node: '24', os: ubuntu-latest }
          - { node: '26', os: ubuntu-latest }
          - { node: '24', os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run smoke
      - run: node dist/cli.js doctor --json
      - run: npm run test:metadata
      - name: Verify committed runtime matches source
        run: git diff --exit-code -- dist

  package:
    name: npm / pnpm / Bun packaged workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false
      - run: bun install --frozen-lockfile
      - run: bun run test:package-managers
      - run: bun pm pack --dry-run
      # `npm publish --dry-run` still talks to the registry, and npm refuses a
      # dry run for a version that already exists ("You cannot publish over the
      # previously published versions"), which would leave every push red
      # between a release and the next version bump. Skip it in exactly that
      # case; anything else still fails.
      - name: publish dry run
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "agentos-for-projects@${VERSION}" version >/dev/null 2>&1; then
            echo "agentos-for-projects@${VERSION} is already published; skipping the publish dry run."
          else
            bun run publish:dry-run
          fi
